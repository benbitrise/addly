---
format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
meta:
  bitrise.io:
    stack: osx-xcode-15.3.x
    machine_type_id: g2.mac.large
workflows:
  '25':
    steps:
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully bla
            set -o pipefail
            # debug log
            set -x

            # write your script here
            echo "Hello World!"
            xcodebuild -version
            xcrun simctl list
    meta:
      bitrise.io:
        stack: osx-minimal
